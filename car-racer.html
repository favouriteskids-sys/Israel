<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.r Racer — Lagos Checkpoint Race</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",Arial,sans-serif;background:#1a1a2e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none}
canvas{border-radius:12px;box-shadow:0 0 40px rgba(0,0,0,0.5)}
</style>
</head>
<body>
<canvas id="g" width="800" height="600"></canvas>
<script>
var c=document.getElementById("g"),g=c.getContext("2d"),W=800,H=600;
var state="menu",score=0,bestTime=999;
var difficulty="normal";
var car={x:0,y:0,a:-Math.PI/2,s:0};
var maxSpd=5.5,cam={x:0,y:0};
var MW=2800,MH=2800;

var diffBtns=[
  {label:"Easy",x:W/2-170,y:H/2+60,w:100,h:40,diff:"easy"},
  {label:"Normal",x:W/2-50,y:H/2+60,w:100,h:40,diff:"normal"},
  {label:"Hard",x:W/2+70,y:H/2+60,w:100,h:40,diff:"hard"}
];

function getDiffSettings(){
  if(difficulty==="easy")return{time:150,maxTraffic:8,trafficSpd:1.2,penalty:120,spawnRate:0.02,multiplier:0.7};
  if(difficulty==="hard")return{time:80,maxTraffic:18,trafficSpd:2.6,penalty:240,spawnRate:0.05,multiplier:1.5};
  return{time:120,maxTraffic:12,trafficSpd:1.8,penalty:180,spawnRate:0.03,multiplier:1.0};
}

var roads=[];
for(var i=0;i<=MW;i+=350)roads.push({x:i-45,y:0,w:90,h:MH,d:"v"});
for(var j=0;j<=MH;j+=350)roads.push({x:0,y:j-45,w:MW,h:90,d:"h"});

var bldgs=[];
for(var bx=0;bx<MW;bx+=350)for(var by=0;by<MH;by+=350){
  if(Math.random()<0.6){
    var bw=60+Math.random()*180,bh=60+Math.random()*180;
    bldgs.push({x:bx+80+Math.random()*(180-bw/2),y:by+80+Math.random()*(180-bh/2),w:bw,h:bh,
    c:["#d4b896","#c9a87c","#b8946a","#e0c9a6","#cbb08e","#8fa3c9"][~~(Math.random()*6)]});
  }
}

var tCars=[];
function spawnT(){var ds=getDiffSettings();if(tCars.length>ds.maxTraffic)return;var r=roads[~~(Math.random()*roads.length)],t;
if(r.d==="v"){t={x:r.x+25,y:Math.random()*MH,vx:0,vy:Math.random()<.5?ds.trafficSpd:-ds.trafficSpd,w:22,h:36};}
else{t={x:Math.random()*MW,y:r.y+25,vx:Math.random()<.5?ds.trafficSpd:-ds.trafficSpd,vy:0,w:36,h:22};}
t.c=["#a83232","#2b4bd8","#7a1fa8","#0e9f6e","#e11d48"][~~(Math.random()*5)];tCars.push(t);}

var cps=[],cpIdx=0,tLeft=0,tTotal=120*60;
function genCP(){
  cps=[
    {x:350,y:2500,l:"START"},
    {x:2200,y:2200,l:"Checkpoint 1"},
    {x:2500,y:700,l:"Checkpoint 2"},
    {x:700,y:400,l:"Checkpoint 3"},
    {x:400,y:1400,l:"Checkpoint 4"},
    {x:1400,y:1400,l:"FINISH"}
  ];
}

function startRace(){
  var ds=getDiffSettings();tTotal=ds.time*60;
  genCP();cpIdx=0;car.x=cps[0].x;car.y=cps[0].y;car.a=-Math.PI/2;car.s=0;
  tLeft=tTotal;score=0;tCars=[];for(var i=0;i<ds.maxTraffic;i++)spawnT();state="play";
}

function finishRace(){
  var elapsed=(tTotal-tLeft)/60;
  if(elapsed<bestTime)bestTime=elapsed;
  score=Math.floor((tLeft/60*500+elapsed<60?1000:elapsed<90?500:0)*getDiffSettings().multiplier);
  state="done";
}

var keys={};
document.addEventListener("keydown",function(e){
  keys[e.key.toLowerCase()]=true;
  if(state==="menu"||state==="done"||state==="over")if(e.key==="Enter"||e.key===" ")startRace();
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(e.key.toLowerCase())>-1)e.preventDefault();
});
document.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
c.addEventListener("click",function(e){
  if(state==="menu"){
    var rect=c.getBoundingClientRect();
    var mx=(e.clientX-rect.left)*(W/rect.width),my=(e.clientY-rect.top)*(H/rect.height);
    for(var i=0;i<diffBtns.length;i++){
      var b=diffBtns[i];
      if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){difficulty=b.diff;return;}
    }
    startRace();
  }else if(state!=="play"){startRace();}
});

function update(){
  var sa=0.055*(car.s/maxSpd);
  if(keys["a"]||keys["arrowleft"])car.a-=sa;
  if(keys["d"]||keys["arrowright"])car.a+=sa;
  if(keys["w"]||keys["arrowup"])car.s+=0.1;
  else if(keys["s"]||keys["arrowdown"])car.s-=0.12;
  else car.s*=0.96;
  car.s=Math.max(-1.5,Math.min(maxSpd,car.s));
  var nx=car.x+Math.cos(car.a)*car.s,ny=car.y+Math.sin(car.a)*car.s;
  if(nx>10&&nx<MW-10&&ny>10&&ny<MH-10){car.x=nx;car.y=ny;}

  for(var i=tCars.length-1;i>=0;i--){
    var t=tCars[i];t.x+=t.vx;t.y+=t.vy;
    if(t.x<-100||t.x>MW+100||t.y<-100||t.y>MH+100){tCars.splice(i,1);continue;}
    if(Math.abs(car.x-t.x)<26&&Math.abs(car.y-t.y)<34){car.s=0;tLeft-=getDiffSettings().penalty;tCars.splice(i,1);}
  }
  if(Math.random()<getDiffSettings().spawnRate)spawnT();
  tLeft--;if(tLeft<=0){state="over";return;}
  var cp=cps[cpIdx],dx=car.x-cp.x,dy=car.y-cp.y;
  if(Math.sqrt(dx*dx+dy*dy)<55){cpIdx++;if(cpIdx>=cps.length){finishRace();return;}}
  cam.x=Math.max(0,Math.min(MW-W,car.x-W/2));
  cam.y=Math.max(0,Math.min(MH-H,car.y-H/2));
}

function drawWorld(){
  g.fillStyle="#2d5a27";g.fillRect(0,0,W,H);
  for(var i=0;i<bldgs.length;i++){
    var b=bldgs[i],sx=b.x-cam.x,sy=b.y-cam.y;
    if(sx+b.w<-50||sx>W+50||sy+b.h<-50||sy>H+50)continue;
    g.fillStyle=b.c;g.fillRect(sx,sy,b.w,b.h);
    g.fillStyle="rgba(255,255,255,0.3)";
    for(var wx=sx+8;wx<sx+b.w-8;wx+=16)for(var wy=sy+8;wy<sy+b.h-8;wy+=16)g.fillRect(wx,wy,8,8);
  }
  g.fillStyle="#4a4a5a";
  for(var i=0;i<roads.length;i++){
    var r=roads[i],sx=r.x-cam.x,sy=r.y-cam.y;
    g.fillRect(sx,sy,r.w,r.h);
    g.strokeStyle="#fff";g.lineWidth=2;g.setLineDash([12,8]);g.beginPath();
    if(r.d==="v"){g.moveTo(sx+r.w/2,sy);g.lineTo(sx+r.w/2,sy+r.h);}
    else{g.moveTo(sx,sy+r.h/2);g.lineTo(sx+r.w,sy+r.h/2);}
    g.stroke();g.setLineDash([]);
  }
  for(var i=0;i<tCars.length;i++){
    var t=tCars[i],sx=t.x-cam.x,sy=t.y-cam.y;
    g.fillStyle=t.c;g.fillRect(sx-t.w/2,sy-t.h/2,t.w,t.h);
  }
  // Checkpoints
  for(var i=cpIdx;i<cps.length;i++){
    var cp=cps[i],sx=cp.x-cam.x,sy=cp.y-cam.y;
    if(sx<-50||sx>W+50||sy<-50||sy>H+50)continue;
    var pulse=15+Math.sin(Date.now()*0.005)*5;
    g.strokeStyle=i===cpIdx?"#f0a500":"#fff";g.lineWidth=i===cpIdx?3:2;
    g.beginPath();g.arc(sx,sy,pulse,0,Math.PI*2);g.stroke();
    if(i===cpIdx){g.fillStyle="rgba(240,165,0,0.2)";g.fill();}
    g.fillStyle=i===cpIdx?"#f0a500":"#fff";g.font="bold 12px 'Segoe UI'";g.textAlign="center";
    g.fillText(cp.l,sx,sy-pulse-6);
  }
  // Arrow to next CP
  if(cpIdx<cps.length){
    var cp=cps[cpIdx],dx=cp.x-car.x,dy=cp.y-car.y,dist=Math.sqrt(dx*dx+dy*dy);
    var ax=W/2+(dx/dist)*180,ay=H/2+(dy/dist)*140;
    ax=Math.max(30,Math.min(W-30,ax));ay=Math.max(30,Math.min(H-30,ay));
    var aa=Math.atan2(dy,dx);
    g.save();g.translate(ax,ay);g.rotate(aa);
    g.fillStyle="#f0a500";g.beginPath();g.moveTo(15,0);g.lineTo(-8,-10);g.lineTo(-8,10);g.closePath();g.fill();
    g.restore();
    g.fillStyle="#fff";g.font="11px 'Segoe UI'";g.textAlign="center";g.fillText(Math.floor(dist)+"m",ax,ay+22);
  }
  // Player
  g.save();g.translate(car.x-cam.x,car.y-cam.y);g.rotate(car.a);
  g.shadowColor="#f0a500";g.shadowBlur=15;
  g.fillStyle="#0e9f6e";g.fillRect(-12,-22,24,44);
  g.fillStyle="#0a6b4c";g.fillRect(-8,-8,16,16);
  g.fillStyle="#f0a500";g.fillRect(-2,-24,4,48);
  g.shadowBlur=0;g.shadowColor="transparent";
  g.fillStyle="#ffe89c";g.fillRect(-10,-22,6,4);g.fillRect(4,-22,6,4);
  g.fillStyle="#ff4444";g.fillRect(-10,18,6,4);g.fillRect(4,18,6,4);
  g.restore();
}

function drawHUD(){
  g.fillStyle="rgba(0,0,0,0.6)";g.fillRect(10,10,280,85);
  g.fillStyle="#fff";g.font="13px 'Segoe UI'";g.textAlign="left";
  g.fillText("Checkpoint "+(cpIdx)+"/5  ["+difficulty.toUpperCase()+"]",20,30);
  g.fillText("Next: "+cps[cpIdx].l,20,48);
  var sec=Math.ceil(tLeft/60);g.fillStyle=sec<20?"#ff4444":"#fff";
  g.fillText("Time: "+sec+"s",20,68);
  g.fillStyle="#0e9f6e";g.fillRect(20,76,Math.max(0,(tLeft/tTotal)*240),4);

  g.fillStyle="rgba(0,0,0,0.6)";g.fillRect(W-150,10,140,50);
  g.fillStyle="#f0a500";g.font="bold 18px 'Segoe UI'";g.textAlign="right";
  g.fillText("Score: "+score,W-20,32);
  g.fillStyle="#fff";g.font="12px 'Segoe UI'";
  g.fillText("Best: "+(bestTime<999?bestTime.toFixed(1)+"s":"---"),W-20,52);
}

function draw(){
  g.clearRect(0,0,W,H);
  if(state==="menu"){
    g.fillStyle="#1a1a2e";g.fillRect(0,0,W,H);
    g.textAlign="center";g.fillStyle="#f0a500";g.font="bold 52px 'Segoe UI'";
    g.fillText("M.R RACER",W/2,H/2-80);
    g.fillStyle="#fff";g.font="22px 'Segoe UI'";g.fillText("LAGOS CHECKPOINT RACE",W/2,H/2-40);
    g.font="15px 'Segoe UI'";g.fillStyle="#aab";
    g.fillText("Race through Lagos, hit 5 checkpoints",W/2,H/2+5);
    g.fillText("W/A/S/D or Arrow keys to drive",W/2,H/2+25);
    g.fillText("Avoid traffic — collisions cost time",W/2,H/2+45);
    g.fillStyle="#fff";g.font="bold 14px 'Segoe UI'";g.fillText("SELECT DIFFICULTY:",W/2,H/2+80);
    for(var i=0;i<diffBtns.length;i++){
      var b=diffBtns[i];
      g.fillStyle=difficulty===b.diff?"#f0a500":"#334";
      g.fillRect(b.x,b.y,b.w,b.h);
      g.fillStyle=difficulty===b.diff?"#1a1a2e":"#fff";g.font="bold 16px 'Segoe UI'";g.fillText(b.label,b.x+b.w/2,b.y+26);
    }
    g.fillStyle="#ffe98a";g.font="15px 'Segoe UI'";g.fillText("Pick difficulty then click to start",W/2,H/2+130);return;
  }
  if(state==="play"){update();drawWorld();drawHUD();return;}
  if(state==="done"){
    drawWorld();
    g.fillStyle="rgba(20,32,92,0.85)";g.fillRect(0,0,W,H);
    g.textAlign="center";g.fillStyle="#f0a500";g.font="bold 48px 'Segoe UI'";
    g.fillText("RACE COMPLETE! ["+difficulty.toUpperCase()+"]",W/2,H/2-50);
    g.fillStyle="#fff";g.font="22px 'Segoe UI'";
    g.fillText("Score: "+score,W/2,H/2);
    g.fillText("Time: "+((tTotal-tLeft)/60).toFixed(1)+"s",W/2,H/2+30);
    if(bestTime<999){g.fillStyle="#0e9f6e";g.fillText("Best: "+bestTime.toFixed(1)+"s",W/2,H/2+60);}
    g.fillStyle="#ffe98a";g.font="bold 18px 'Segoe UI'";
    g.fillText("Click or Enter to race again",W/2,H/2+100);return;
  }
  if(state==="over"){
    drawWorld();
    g.fillStyle="rgba(20,10,10,0.85)";g.fillRect(0,0,W,H);
    g.textAlign="center";g.fillStyle="#ff4444";g.font="bold 48px 'Segoe UI'";
    g.fillText("TIME'S UP! ["+difficulty.toUpperCase()+"]",W/2,H/2-40);
    g.fillStyle="#fff";g.font="22px 'Segoe UI'";
    g.fillText("Checkpoints: "+cpIdx+"/5   Score: "+score,W/2,H/2+10);
    g.fillStyle="#ffe98a";g.font="bold 18px 'Segoe UI'";
    g.fillText("Click or Enter to try again",W/2,H/2+60);
  }
}

function loop(){draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
