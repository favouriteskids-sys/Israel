<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.r Racer — Lagos Straight Road</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f4f8;overflow:hidden;user-select:none;font-family:'Segoe UI',system-ui,Arial}
canvas{display:block;width:100vw;height:100vh}
h1{margin:0;padding:20px;text-align:center;color:#2b4bd8;font-size:28px}
.game-wrapper{max-width:480px;margin:auto;padding:20px}
.score-board{background:white;padding:15px;border-radius:10px;margin:15px 0;text-align:center;color:#2b4bd8}
.difficulty-btns{display:flex;gap:8px;justify-content:center;flex-wrap:margin:15px 0}
.diff-btn{padding:8px 16px;border:none;border-radius:20px;background:#2b4bd8;color:white;font-size:14px;cursor:pointer}
.diff-btn:hover{background:#1e3a8a}
.control-hint{text-align:center;padding:10px;color:#666;font-size:12px}
</style>
</head>
<body>
<div class="game-wrapper">
<h1>M.r Racer</h1>
<div class="score-board">Checkpoints: <span id="cp">0</span>/5</div>
<canvas id="g"></canvas>
<div class="difficulty-btns">
  <button class="diff-btn easy" data-diff="easy">Easy</button>
  <button class="diff-btn normal active" data-diff="normal">Normal</button>
  <button class="diff-btn hard" data-diff="hard">Hard</button>
</div>
<div class="control-hint">W or Up = Gas • S or Down = Brake • A/D or Left/Right = Dodge</div>
</div>
<script>
var c=document.getElementById("g"),g=c.getContext("2d"),W=window.innerWidth,H=window.innerHeight;
c.width=W;c.height=H;
window.addEventListener("resize",function(){W=window.innerWidth;H=window.innerHeight;c.width=W;c.height=H;});

var state="menu",score=0,bestTime=999,difficulty="normal";
var roadW=Math.min(300,W*0.35),roadX=(W-roadW)/2;
var totalLen=8000;

var diffSettings={
  easy:{time:60,maxTraffic:8,trafficSpd:2,penalty:60,spawnRate:0.05,multiplier:0.7,maxSpd:3},
  hard:{time:40,maxTraffic:14,trafficSpd:3.5,penalty:100,spawnRate:0.08,multiplier:1.3,maxSpd:5},
  normal:{time:50,maxTraffic:10,trafficSpd:2.5,penalty:80,spawnRate:0.065,multiplier:1.0,maxSpd:4}
};

function getDiff(){return diffSettings[difficulty]||diffSettings.normal;}

var bldgs=[];
function genBldgs(){
  bldgs=[];
  for(var y=0;y<totalLen;y+=80+Math.random()*60){
    if(Math.random()<0.5){
      var bw=40+Math.random()*50,bh=30+Math.random()*40;
      var c=["#ff6b6b","#5f27cd","#1dd1af","#ff8c42","#2b4bd8"][Math.floor(Math.random()*5)];
      bldgs.push({x:roadX-80-Math.random()*30,y:y,w:bw,h:bh,c:c});
    }
    if(Math.random()<0.5){
      var bw2=40+Math.random()*50,bh2=30+Math.random()*40;
      var c2=["#ff6b6b","#5f27cd","#1dd1af","#ff8c42","#2b4bd8"][Math.floor(Math.random()*5)];
      bldgs.push({x:roadX+roadW+30+Math.random()*30,y:y,w:bw2,h:bh2,c:c2});
    }
  }
}

var car={x:roadX+roadW/2-15,y:H-50,w:28,h:48,spd:0};
var tCars=[];

function spawnT(){
  var ds=getDiff();
  if(tCars.length>=ds.maxTraffic)return;
  var lane=roadX+20+Math.random()*(roadW-40);
  tCars.push({x:lane,y:car.y-H-80-Math.random()*400,w:22,h:44,
    spd:ds.trafficSpd+Math.random()*1,
    c:["#ff6b6b","#5f27cd","#1dd1af","#ff8c42","#2b4bd8"][Math.floor(Math.random()*5)]});
}

var cps=[],cpIdx=0,tLeft=0,tTotal;
function genCP(){
  cps=[
    {y:100,l:"START"},{y:800,l:"Checkpoint 1"},{y:1500,l:"Checkpoint 2"},
    {y:2200,l:"Checkpoint 3"},{y:2900,l:"Checkpoint 4"},{y:3600,l:"FINISH"}
  ];
}

function startRace(){
  var ds=getDiff();tTotal=ds.time*60;difficulty=document.querySelector('.diff-btn.active').getAttribute("data-diff");
  genCP();genBldgs();cpIdx=0;car.x=roadX+roadW/2-15;car.y=H-50;car.spd=0;
  tLeft=tTotal;score=0;tCars=[];
  for(var i=0;i<ds.maxTraffic;i++)spawnT();
  state="play";
}

function finishRace(){
  var elapsed=(tTotal-tLeft)/60;
  score=Math.floor((tLeft/60*500+(elapsed<30?1000:elapsed<45?500:0))*getDiff().multiplier);
  state="done";
}

var keys={};
document.addEventListener("keydown",function(e){
  if(state==="menu"){if(e.key==="Enter"||e.key===" ")startRace();return;}
  if(state==="done"||state==="over"){if(e.key==="Enter"||e.key===" ")startRace();return;}
  keys[e.key.toLowerCase()]=true;
  if(["arrowup","arrowdown","arrowleft","arrowright","w","s"," "].indexOf(e.key.toLowerCase())>-1)e.preventDefault();
});
document.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});

document.querySelectorAll(".diff-btn").forEach(b=>b.addEventListener("click",function(){
  document.querySelectorAll(".diff-btn").forEach(x=>x.classList.remove("active"));
  this.classList.add("active");});

c.addEventListener("click",function(){
  if(state==="menu")startRace();
});

function update(){
  var ds=getDiff();
  if(keys["a"]||keys["arrowleft"])car.x-=5;
  if(keys["d"]||keys["arrowright"])car.x+=5;
  car.x=Math.max(roadX+8,Math.min(roadX+roadW-car.w-8,car.x));

  if(keys["w"]||keys["arrowup"])car.spd=Math.min(ds.maxSpd,car.spd+0.1);
  else if(keys["s"]||keys["arrowdown"])car.spd=Math.max(0,car.spd-0.12);
  else car.spd*=0.96;

  car.y+=car.spd;tLeft--;
  if(tLeft<=0){state="over";return;}

  for(var i=tCars.length-1;i>=0;i--){
    var t=tCars[i];t.y-=t.spd;
    if(t.y<car.y-H-80){tCars.splice(i,1);continue;}
    if(Math.abs(car.x-t.x)<20&&car.y+car.h>t.y&&car.y<t.y+t.h){
      tLeft-=ds.penalty;tCars.splice(i,1);
    }
  }
  if(Math.random()<ds.spawnRate)spawnT();

  if(car.y>=cps[cpIdx].y){cpIdx++;if(cpIdx>=cps.length){finishRace();return;}}
}

function draw(){
  W=window.innerWidth;H=window.innerHeight;c.width=W;c.height=H;
  roadW=Math.min(300,W*0.35);roadX=(W-roadW)/2;

  if(state==="menu"){
    g.fillStyle="#f0f4f8";g.fillRect(0,0,W,H);
    g.fillStyle="#2b4bd8";g.font="bold 28px 'Segoe UI'";g.textAlign="center";
    g.fillText("M.r Racer",W/2,H/2-40);
    g.fillStyle="#666";g.font="14px 'Segoe UI'";g.fillText("Race through Lagos, hit 5 checkpoints",W/2,H/2);
    g.fillStyle="#2b4bd8";g.font="bold 16px 'Segoe UI'";g.fillText("W/Up = Gas • S/Down = Brake • A/D = Dodge",W/2,H/2+40);
    document.querySelectorAll(".diff-btn").forEach(b=>b.classList.remove("active"));
    document.querySelector(".diff-btn.normal").classList.add("active");
    requestAnimationFrame(draw);return;
  }

  if(state==="play")update();

  g.fillStyle="#2b4bd8";g.fillRect(0,0,W,H);
  g.fillStyle="#5b9bd4";g.fillRect(roadX,0,roadW,H);
  g.fillStyle="#2563eb";g.fillRect(roadX-5,0,5,H);g.fillRect(roadX+roadW+5,0,5,H);

  for(var i=0;i<bldgs.length;i++){
    var b=bldgs[i];g.fillStyle=b.c;g.fillRect(b.x,b.y-car.y+car.y+Math.random()*50,b.w,b.h);
  }

  for(var i=0;i<tCars.length;i++){
    var t=tCars[i];var sy=t.y-car.y+H-camY;
    if(sy<-50||sy>H+50)continue;
    g.fillStyle=t.c;g.fillRect(t.x-10,sy,t.w+20,t.h);
  }

  var csy=car.y-car.y+H;g.fillStyle="#2b4bd8";g.fillRect(car.x-14,csy-20,44,64);

  for(var i=cpIdx;i<cps.length;i++){
    var py=cps[i].y-car.y+H;if(py<-30||py>H+30)continue;
    g.fillStyle="#f0a500";g.fillRect(roadX-15,py-10,roadW+30,20);
    g.fillStyle="#fff";g.font="bold 12px 'Segoe UI'";g.textAlign="center";g.fillText(cps[i].l,roadX+roadW/2,py+4);
  }

  g.fillStyle="rgba(0,0,0,0.6)";g.fillRect(10,10,200,50);
  g.fillStyle="#fff";g.font="12px 'Segoe UI'";g.textAlign="left";
  g.fillText("Checkpoint "+cpIdx+"/5",20,30);
  g.fillText("Time: "+Math.ceil(tLeft/60)+"s",20,50);

  if(state==="done"){
    g.fillStyle="rgba(0,0,0,0.5)";g.fillRect(0,0,W,H);
    g.fillStyle="#2b4bd8";g.font="bold 32px 'Segoe UI'";g.textAlign="center";
    g.fillText("RACE COMPLETE!",W/2,H/2-20);
    g.fillStyle="#fff";g.font="20px 'Segoe UI'";g.fillText("Score: "+score,W/2,H/2+20);
    g.fillText("Best: "+bestTime<999?bestTime+"s":"--",W/2,H/2+50);
    g.fillText("Click or Enter to race again",W/2,H/2+90);
  }
  if(state==="over"){
    g.fillStyle="rgba(0,0,0,0.5)";g.fillRect(0,0,W,H);
    g.fillStyle="#dc2626";g.font="bold 32px 'Segoe UI'";g.textAlign="center";
    g.fillText("TIME'S UP!",W/2,H/2-20);
    g.fillStyle="#fff";g.font="20px 'Segoe UI'";g.fillText("Checkpoints: "+cpIdx+"/5 Score: "+score,W/2,H/2+20);
    g.fillText("Click or Enter to try again",W/2,H/2+70);
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
