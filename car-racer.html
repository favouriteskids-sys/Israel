<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.r Racer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(180deg, #5bc0de 0%, #d6a86c 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            user-select: none;
        }
        h1 { font-size: 28px; margin-bottom: 4px; text-shadow: 0 2px 8px rgba(20,32,92,0.35); }
        h1 span { color: #f0a500; }
        .hud {
            display: flex; justify-content: space-between; align-items: center;
            width: 500px; padding: 10px 8px; font-size: 14px; color: #1f2a44;
            background: rgba(255,255,255,0.75); border-radius: 10px 10px 0 0; font-weight: 600;
        }
        .hud b { color: #e8850c; }
        .hud .p1 { color: #0e9f6e; font-weight: 700; }
        .hud .p2 { color: #a83232; font-weight: 700; }
        canvas {
            border-radius: 0 0 14px 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            cursor: default;
        }
        .tip { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,0.9); }
    </style>
</head>
<body>
    <h1>M.r <span>Racer</span></h1>
    <div class="hud">
        <span><span class="p1">YOU</span> 🪙 <b id="c1">0</b></span>
        <span><span class="p1">YOU</span> <b id="d1">0</b>m</span>
        <span>vs</span>
        <span><span class="p2">CPU</span> <b id="d2">0</b>m</span>
        <span><span class="p2">CPU</span> 🪙 <b id="c2">0</b></span>
    </div>
    <canvas id="g" width="500" height="600"></canvas>
    <div class="tip">Tap <b>A</b> / <b>D</b> or <b>Click left/right</b> to steer — that's it!</div>

    <script>
        var c = document.getElementById('g');
        var x = c.getContext('2d');
        var W = 500, H = 600;
        var RL = 50, RR = W - 50, RW = RR - RL;

        var S = 'menu';
        var t = 0;
        var off = 0;

        var p1 = { px: 0, coins: 0, dist: 0 };
        var p2 = { px: 0, coins: 0, dist: 0 };
        var coins = [];
        var k = {};
        var spin = 0;

        function go() {
            p1 = { px: RL + RW / 4 - 22, coins: 0, dist: 0 };
            p2 = { px: RL + RW * 3 / 4 - 22, coins: 0, dist: 0 };
            coins = [];
            off = 0;
            spin = 0;
            t = 0;
            S = 'play';
        }

        function hud() {
            document.getElementById('c1').textContent = p1.coins;
            document.getElementById('d1').textContent = Math.floor(p1.dist);
            document.getElementById('c2').textContent = p2.coins;
            document.getElementById('d2').textContent = Math.floor(p2.dist);
        }

        function addCoin() {
            var cols = 4;
            var cw = RW / cols;
            var col = Math.floor(Math.random() * cols);
            var cx = RL + col * cw + cw / 2;
            coins.push({ px: cx, py: -20 });
        }

        function drawBG() {
            var s = x.createLinearGradient(0, 0, 0, H);
            s.addColorStop(0, '#8ed1f7');
            s.addColorStop(0.3, '#bfe6ff');
            s.addColorStop(0.5, '#e8f7ff');
            x.fillStyle = s;
            x.fillRect(0, 0, W, H);

            x.fillStyle = 'rgba(255,220,100,0.35)';
            x.beginPath(); x.arc(W - 60, 55, 40, 0, Math.PI * 2); x.fill();
            x.fillStyle = '#ffe98a';
            x.beginPath(); x.arc(W - 60, 55, 28, 0, Math.PI * 2); x.fill();

            x.fillStyle = '#b8bfc9';
            x.fillRect(0, 0, RL - 6, H);
            x.fillRect(RR + 6, 0, W - RR - 6, H);

            x.fillStyle = '#5a616e';
            x.fillRect(RL, 0, RW, H);

            x.fillStyle = '#fff';
            x.fillRect(RL, 0, 5, H);
            x.fillRect(RR - 5, 0, 5, H);

            x.strokeStyle = '#f2f4ff';
            x.lineWidth = 4;
            x.setLineDash([28, 22]);
            for (var i = 1; i < 4; i++) {
                var lx = RL + (RW / 4) * i;
                x.beginPath();
                x.moveTo(lx, off % 50);
                x.lineTo(lx, H);
                x.stroke();
            }
            x.setLineDash([]);

            var n = Math.ceil(H / 80) + 2;
            for (var side = -1; side <= 1; side += 2) {
                var left = side < 0;
                for (var i = 0; i < n; i++) {
                    var by = ((i * 80 + off * 0.7) % (H + 160)) - 80;
                    var bh = 80 + ((i * 137) % 120);
                    var bw = 40 + ((i * 53) % 18);
                    var bx = left ? RL - bw - 4 : RR + 4;
                    var cols = ['#d4b896','#c9a87c','#b8946a','#e0c9a6','#cbb08e'];
                    x.fillStyle = cols[i % cols.length];
                    x.fillRect(bx, by + 80 - bh, bw, bh);
                    x.fillStyle = 'rgba(255,255,255,0.4)';
                    for (var wy = by + 80 - bh + 8; wy < by + 65; wy += 16)
                        for (var wx = bx + 5; wx < bx + bw - 7; wx += 10)
                            x.fillRect(wx, wy, 5, 8);
                }
            }
        }

        function drawLambo(px, py, col, roof, lbl) {
            var cw = 48, ch = 60;

            if (lbl === 'YOU') {
                x.shadowColor = '#f0a500';
                x.shadowBlur = 18;
            }

            x.fillStyle = col;
            x.beginPath();
            x.moveTo(px + 5, py);
            x.lineTo(px + cw - 5, py);
            x.lineTo(px + cw, py + 14);
            x.lineTo(px + cw, py + ch - 16);
            x.lineTo(px + cw - 3, py + ch);
            x.lineTo(px + 3, py + ch);
            x.lineTo(px, py + ch - 16);
            x.lineTo(px, py + 14);
            x.closePath();
            x.fill();

            x.fillStyle = roof;
            x.beginPath();
            x.moveTo(px + 9, py + 12);
            x.lineTo(px + cw - 9, py + 12);
            x.lineTo(px + cw - 5, py + 28);
            x.lineTo(px + 5, py + 28);
            x.closePath();
            x.fill();

            x.fillStyle = '#f0a500';
            x.fillRect(px + cw / 2 - 3, py + 2, 6, ch - 5);

            x.fillStyle = '#ffe89c';
            x.beginPath();
            x.moveTo(px + 1, py + 4); x.lineTo(px + 12, py); x.lineTo(px + 12, py + 7); x.lineTo(px + 1, py + 7);
            x.closePath(); x.fill();
            x.beginPath();
            x.moveTo(px + cw - 1, py + 4); x.lineTo(px + cw - 12, py); x.lineTo(px + cw - 12, py + 7); x.lineTo(px + cw - 1, py + 7);
            x.closePath(); x.fill();

            x.fillStyle = '#ff4444';
            x.fillRect(px + 2, py + ch - 5, 12, 3);
            x.fillRect(px + cw - 14, py + ch - 5, 12, 3);

            x.fillStyle = '#111827';
            x.fillRect(px - 2, py + 9, 5, 12);
            x.fillRect(px + cw - 3, py + 9, 5, 12);
            x.fillRect(px - 2, py + ch - 20, 5, 12);
            x.fillRect(px + cw - 3, py + ch - 20, 5, 12);

            x.fillStyle = '#cde9ff';
            x.beginPath();
            x.moveTo(px + 10, py + 14); x.lineTo(px + cw - 10, py + 14);
            x.lineTo(px + cw - 6, py + 26); x.lineTo(px + 6, py + 26);
            x.closePath(); x.fill();

            x.fillStyle = '#fff';
            x.font = 'bold 10px "Segoe UI"';
            x.textAlign = 'center';
            x.fillText(lbl, px + cw / 2, py - 4);

            x.shadowColor = 'transparent';
            x.shadowBlur = 0;
        }

        function update() {
            var spd = 4;

            if (k['a'] || k['arrowleft']) p1.px -= spd;
            if (k['d'] || k['arrowright']) p1.px += spd;
            p1.px = Math.max(RL + 4, Math.min(RR - 52, p1.px));

            var tx = RL + RW * 3 / 4 - 22;
            var bd = 999;
            for (var i = 0; i < coins.length; i++) {
                var cn = coins[i];
                if (cn.py < p2.py + 40 && cn.py > p2.py - 150) {
                    var d = Math.abs(cn.px - p2.px - 24);
                    if (d < bd) { bd = d; tx = cn.px - 24; }
                }
            }
            p2.px += (tx - p2.px) * 0.05;
            p2.px = Math.max(RL + 4, Math.min(RR - 52, p2.px));

            off += 5;
            p1.dist += 0.25;
            p2.dist += 0.25;
            spin += 0.08;

            t++;
            if (t % 55 === 0) addCoin();

            for (var i = coins.length - 1; i >= 0; i--) {
                var cn = coins[i];
                cn.py += 2.5;
                if (cn.py > H + 20) { coins.splice(i, 1); continue; }

                if (cn.px > p1.px - 6 && cn.px < p1.px + 54 && cn.py > p1.py && cn.py < p1.py + 60) {
                    p1.coins++;
                    coins.splice(i, 1); continue;
                }
                if (cn.px > p2.px - 6 && cn.px < p2.px + 54 && cn.py > p2.py && cn.py < p2.py + 60) {
                    p2.coins++;
                    coins.splice(i, 1);
                }
            }
            hud();
        }

        function draw() {
            x.clearRect(0, 0, W, H);
            drawBG();

            for (var i = 0; i < coins.length; i++) {
                var cn = coins[i];
                var s = Math.abs(Math.cos(spin));
                x.fillStyle = '#ffc93c';
                x.beginPath(); x.ellipse(cn.px, cn.py, 10 * s + 3, 13, 0, 0, Math.PI * 2); x.fill();
                x.fillStyle = '#e8850c';
                x.beginPath(); x.ellipse(cn.px, cn.py, 5 * s + 2, 7, 0, 0, Math.PI * 2); x.fill();
            }

            drawLambo(p1.px, p1.y, '#0e9f6e', '#0a6b4c', 'YOU');
            drawLambo(p2.px, p2.y, '#a83232', '#6b1a1a', 'CPU');

            if (S === 'menu') {
                x.fillStyle = 'rgba(20,32,92,0.88)';
                x.fillRect(0, 0, W, H);
                x.textAlign = 'center';
                x.fillStyle = '#f0a500';
                x.font = 'bold 44px "Segoe UI"';
                x.fillText('M.R RACER', W / 2, H / 2 - 60);
                x.fillStyle = '#fff';
                x.font = '20px "Segoe UI"';
                x.fillText('YOU  vs  CPU', W / 2, H / 2 - 22);
                x.font = '16px "Segoe UI"';
                x.fillStyle = '#dfe5ff';
                x.fillText('A / D to steer left and right', W / 2, H / 2 + 14);
                x.fillText('Grab the coins before the CPU!', W / 2, H / 2 + 40);
                x.fillStyle = '#ffe98a';
                x.font = 'bold 22px "Segoe UI"';
                x.fillText('TAP OR CLICK TO START', W / 2, H / 2 + 90);
            }
        }

        function loop() {
            if (S === 'play') update();
            draw();
            requestAnimationFrame(loop);
        }

        p1.y = H - 100;
        p2.y = H - 100;
        p1.px = RL + RW / 4 - 22;
        p2.px = RL + RW * 3 / 4 - 22;

        document.addEventListener('keydown', function(e) {
            k[e.key.toLowerCase()] = true;
            if (S === 'menu') go();
            e.preventDefault();
        });
        document.addEventListener('keyup', function(e) { k[e.key.toLowerCase()] = false; });
        c.addEventListener('click', function() { if (S === 'menu') go(); });
        c.addEventListener('touchstart', function() { if (S === 'menu') go(); }, { passive: true });
        document.body.addEventListener('click', function() { if (S === 'menu') go(); });
        document.body.addEventListener('touchstart', function() { if (S === 'menu') go(); }, { passive: true });

        loop();
    </script>
</body>
</html>
