<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>M.r Racer — Lagos Straight Road</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}h1{text-align:center;padding:20px;color:#f0a500}.wrap{max-width:420px;margin:auto;padding:20px}.score{text-align:center;padding:10px;background:rgba(255,165,0,0.2);margin:10px 0}.hint{text-align:center;color:#aaa;font-size:12px}.btn{display:block;width:100%;padding:10px;margin:5px 0;background:#f0a500;color:#1a1a2e;border:none;border-radius:8px;cursor:pointer}.btn:hover{background:#e69500}</style></head><body><div class="wrap"><h1>M.r Racer</h1><div class="score">Checkpoints: <span id="cp">0</span>/5</div><canvas id="g"></canvas><div class="btn easy active" data-d="easy">Easy</div><div class="btn normal active" data-d="normal">Normal</div><div class="btn hard" data-d="hard">Hard</div><div class="hint">A/D or Left/Right = Steer • W or Up = Accelerate • S or Down = Brake</div></div><script>var c=document.getElementById("g"),g=c.getContext("2d"),W=window.innerWidth,H=window.innerHeight;c.width=W;c.height=H;window.addEventListener("resize",function(){W=window.innerWidth;H=window.innerHeight;c.width=W;c.height=H;});var state="menu",score=0,bestTime=999,difficulty="normal",roadW=Math.min(300,W*0.35),roadX=(W-roadW)/2,totalLen=5000;var car={x:roadX+roadW/2-15,y:H-20,w:30,h:50,angle:0,vy:0};var tCars=[];var cps=[],cpIdx=0,tLeft=0,tTotal;function getDiff(){if(difficulty==="easy")return{time:90,maxT:8,spd:2,pen:90,mr:0.05,mult:0.7};if(difficulty==="hard")return{time:60,maxT:14,spd:3.5,pen:150,mr:0.08,mult:1.3};return{time:75,maxT:10,spd:2.5,pen:120,mr:0.065,mult:1.0}};function genCP(){cps=[{y:0,l:"START"},{y:800,l:"CP1"},{y:1600,l:"CP2"},{y:2400,l:"CP3"},{y:3200,l:"CP4"},{y:4000,l:"FINISH}]};function startRace(){var ds=getDiff();tTotal=ds.time*60;difficulty=document.querySelector('.active').getAttribute("data-d");genCP();cpIdx=0;car.x=roadX+roadW/2-15;car.y=H-20;car.angle=0;car.vy=0;tLeft=tTotal;score=0;tCars=[];for(var i=0;i<ds.maxT;i++)spawnT();state="play"}function finishRace(){var el=(tTotal-tLeft)/60;score=Math.floor((tLeft/60*500+(el<30?1000:el<45?500:0))*getDiff().mult);state="done"}document.querySelectorAll(".btn").forEach(b=>b.addEventListener("click",function(){document.querySelectorAll(".btn").forEach(x=>x.classList.remove("active");this.classList.add("active");}));document.addEventListener("keydown",function(e){if(state==="menu"){if(e.key==="Enter"||e.key===" "){startRace();}}if(state==="play"){if(e.key==="w"||e.key=="ArrowUp"){car.vy-=1;car.angle=Math.min(10,car.angle+2);}if(e.key=="s"||e.key=="Arrowdown"){car.vy+=0.5;car.angle=Math.max(-10,car.angle-2);}}if(["ArrowLeft","ArrowRight","a","d","w","s"," "].indexOf(e.key.toLowerCase())>-1)e.preventDefault();});document.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});var keys={};c.addEventListener("click",function(){if(state==="menu")startRace();});function update(){var ds=getDiff();if(keys["a"]||keys["Arrowleft"]){car.x-=6;car.x=Math.max(roadX+8,Math.min(roadX+roadW-car.w-8,car.x))}if(keys["d"]||keys["Arrowright"]){car.x+=6;car.x=Math.max(roadX+8,Math.min(roadX+roadW-car.w-8,car.x))}if(car.vy<-5){car.vy+=0.3;car.angle=Math.max(-10,car.angle-1);}if(car.vy>5){car.vy-=0.3;car.angle=Math.max(-10,car.angle-1);}car.x+=car.vy*0.5;car.angle*=0.9;tLeft--;if(tLeft<=0){state="over";return;}for(var i=tCars.length-1;i>=0;i--){var t=tCars[i];t.y-=t.spd;if(t.y<car.y-H-50){tCars.splice(i,1);continue;}if(Math.abs(car.x-t.x)<20&&car.y+car.h>t.y&&car.y<t.y+t.h){tLeft-=ds.pen;tCars.splice(i,1)}};if(Math.random()<ds.mr)spawnT();var cpY=cps[cpIdx].y;if(car.y>=cpY){cpIdx++;if(cpIdx>=cps.length){finishRace();return}}};function spawnT(){var ds=getDiff();if(tCars.length>=ds.maxT)return;var lane=roadX+20+Math.random()*(roadW-40);tCars.push({x:lane,y:car.y-H-60-Math.random()*300,w:22,h:40,spd:ds.spd+Math.random()*1,c:"#ff6b6b"})}function draw(){W=window.innerWidth;H=window.innerHeight;c.width=W;c.height=H;roadW=Math.min(300,W*0.35);roadX=(W-roadW)/2;if(state==="menu"){g.fillStyle="#1a1a2e";g.fillRect(0,0,W,H);g.fillStyle="#f0a500";g.font="bold 24px 'Segoe UI'";g.textAlign="center";g.fillText("M.r Racer",W/2,H/2-40);g.fillStyle="#666";g.font="12px 'Segoe UI'";g.fillText("Race through Lagos, hit 5 checkpoints",W/2,H/2);g.fillStyle="#f0a500";g.font="bold 14px 'Segoe UI'";g.fillText("W/Up=Accel S/Down=Brake A/D=Steer",W/2,H/2+40);document.querySelectorAll(".btn").forEach(b=>b.classList.add("active"));requestAnimationFrame(draw);return}if(state==="play")update();g.fillStyle="#1a1a2e";g.fillRect(0,0,W,H);g.fillStyle="#0f0f23";g.fillRect(roadX,0,roadW,H);g.fillStyle="#1e1e36";g.fillRect(roadX-5,0,5,H);g.fillStyle="#1e1e36";g.fillRect(roadX+roadW+5,0,5,H);for(var i=0;i<tCars.length;i++){var t=tCars[i];var sy=t.y;g.fillStyle=t.c;g.fillRect(t.x-10,sy-20,t.w+20,t.h)}g.fillStyle="#f0a500";g.save();g.translate(car.x+15,car.y+25);g.rotate(car.angle*Math.PI/18);g.fillStyle="#0e9f6e";g.fillRect(-15,-25,30,50);g.fillStyle="#0a6b4c";g.fillRect(-10,-45,20,30);g.fillStyle="#f0a500";g.fillRect(-5,-55,10,10);g.restore();for(var i=cpIdx;i<cps.length;i++){var py=cps[i].y;if(py<-50||py>H+50)continue;g.fillStyle="#ffd700";g.fillRect(roadX-15,py-10,roadW+30,20);g.fillStyle="#fff";g.font="bold 11px 'Segoe UI'";g.textAlign="center";g.fillText(cps[i].l,roadX+roadW/2,py+4)}g.fillStyle="rgba(0,0,0,0.6)";g.fillRect(10,10,180,35);g.fillStyle="#fff";g.font="12px 'Segoe UI'";g.textAlign="left";g.fillText("Checkpoint "+cpIdx+"/5",20,30);g.fillText("Time: "+Math.ceil(tLeft/60)+"s",20,50);if(state==="done"){g.fillStyle="rgba(0,0,0,0.6)";g.fillRect(0,0,W,H);g.fillStyle="#f0a500";g.font="bold 28px 'Segoe UI'";g.textAlign="center";g.fillText("RACE COMPLETE!",W/2,H/2-30);g.fillStyle="#fff";g.font="20px 'Segoe UI'";g.fillText("Score: "+score,W/2,H/2+20);g.fillText("Best: "+bestTime<999?bestTime+"s":"--",W/2,H/2+50);g.fillText("Click or Enter to race again",W/2,H/2+90)}if(state==="over"){g.fillStyle="rgba(0,0,0,0.6)";g.fillRect(0,0,W,H);g.fillStyle="#dc2626";g.font="bold 28px 'Segoe UI'";g.textAlign="center";g.fillText("TIME'S UP!",W/2,H/2-30);g.fillStyle="#fff";g.font="20px 'Segoe UI'";g.fillText("Checkpoints: "+cpIdx+"/5 Score: "+score,W/2,H/2+20);g.fillText("Click or Enter to try again",W/2,H/2+70)}requestAnimationFrame(draw)}draw();</script></body></html>
