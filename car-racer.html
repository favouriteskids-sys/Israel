<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>M.r Racer Chick Poki</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f0f4f8;overflow:hidden;font-family:sans-serif}canvas{display:block;width:100vw;height:100vh}h1{text-align:center;padding:20px;color:#2b4bd8} .wrap{max-width:400px;margin:auto;padding:20px} .btn{display:block;width:100%;padding:10px;margin:5px 0;background:#2b4bd8;color:white;border:none;border-radius:8px;cursor:pointer}.score{text-align:center;padding:10px;background:white;margin:10px 0}.hint{text-align:center;color:#666;font-size:12px}</style></head><body><div class="wrap"><h1>M.r Racer</h1><div class="score">Checkpoints: <span id="cp">0</span>/5</div><canvas id="g"></canvas><div class="btn easy active" data-d="easy">Easy</div><div class="btn normal active" data-d="normal">Normal</div><div class="btn hard" data-d="hard">Hard</div><div class="hint">A/D or Left/Right = Dodge • W or Up = Gas • S or Down = Brake</div></div><script>var c=document.getElementById("g"),g=c.getContext("2d"),W=window.innerWidth,H=window.innerHeight;c.width=W;c.height=H;window.addEventListener("resize",function(){W=window.innerWidth;H=window.innerHeight;c.width=W;c.height=H;});var state="menu",score=0,best=999,difficulty="normal",roadW=Math.min(300,W*0.35),roadX=(W-roadW)/2,totalLen=5000,car={x:roadX+roadW/2-15,y:H-40,w:25,h:45,spd:0},tCars=[],cps=[],cpIdx=0,tLeft=0,tTotal;function getDiff(){if(difficulty==="easy")return{time:60,maxT:8,spd:2,pen:60,mr:0.05,mult:0.7};if(difficulty==="hard")return{time:40,maxT:14,spd:3.5,pen:100,mr:0.08,mult:1.3};return{time:50,maxT:10,spd:2.5,pen:80,mr:0.065,mult:1.0}};function genCP(){cps=[{y:80,l:"START"},{y:700,l:"CP1"},{y:1400,l:"CP2"},{y:2100,l:"CP3"},{y:2800,l:"CP4"},{y:3500,l:"FINISH}]};function startRace(){var ds=getDiff();tTotal=ds.time*60;difficulty=document.querySelector('.active').getAttribute("data-d");genCP();cpIdx=0;car.x=roadX+roadW/2-15;car.y=H-40;car.spd=0;tLeft=tTotal;score=0;tCars=[];for(var i=0;i<ds.maxT;i++)spawnT();state="play"}function finishRace(){var el=(tTotal-tLeft)/60;score=Math.floor((tLeft/60*500+(el<30?1000:el<45?500:0))*getDiff().mult);state="done"}document.querySelectorAll(".btn").forEach(b=>b.addEventListener("click",function(){document.querySelectorAll(".btn").forEach(x=>x.classList.remove("active");this.classList.add("active");}));document.addEventListener("keydown",function(e){if(state==="menu"){if(e.key==="Enter"||e.key===" "){startRace();}}if(state==="play"){if(e.key==="w"||e.key=="ArrowUp")car.spd=Math.min(getDiff().spd,car.spd+0.1);if(e.key=="s"||e.key=="ArrowDown")car.spd=Math.max(0,car.spd-0.12)}if(["ArrowLeft","ArrowRight","a","d","w","s"," "].indexOf(e.key.toLowerCase())>-1)e.preventDefault();});document.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});c.addEventListener("click",function(){if(state==="menu")startRace();});var keys={};function update(){var ds=getDiff();if(keys["a"]||keys["Arrowleft"]){car.x-=5;car.x=Math.max(roadX+8,Math.min(roadX+roadW-car.w-8,car.x))}if(keys["d"]||keys["Arrowright"]){car.x+=5;car.x=Math.max(roadX+8,Math.min(roadX+roadW-car.w-8,car.x))}if(keys["w"]||keys["Arrowup"])car.spd=Math.min(ds.spd,car.spd+0.1);else if(keys["s"]||keys["Arrowdown"])car.spd=Math.max(0,car.spd-0.12);else car.spd*=0.96;car.y+=car.spd;tLeft--;if(tLeft<=0){state="over";return;}for(var i=tCars.length-1;i>=0;i--){var t=tCars[i];t.y-=t.spd;if(t.y<car.y-H-50){tCars.splice(i,1);continue;}if(Math.abs(car.x-t.x)<20&&car.y+car.h>t.y&&car.y<t.y+t.h){tLeft-=ds.pen;tCars.splice(i,1)}};if(Math.random()<ds.mr)spawnT();var cpY=cps[cpIdx].y;if(car.y>=cpY){cpIdx++;if(cpIdx>=cps.length){finishRace();return}}};function spawnT(){var ds=getDiff();if(tCars.length>=ds.maxT)return;var lane=roadX+20+Math.random()*(roadW-40);tCars.push({x:lane,y:car.y-H-60-Math.random()*300,w:22,h:40,spd:ds.spd+Math.random()*1,c:"#ff6b6b"})}function draw(){W=window.innerWidth;H=window.innerHeight;c.width=W;c.height=H;roadW=Math.min(300,W*0.35);roadX=(W-roadW)/2;if(state==="menu"){g.fillStyle="#f0f4f8";g.fillRect(0,0,W,H);g.fillStyle="#2b4bd8";g.font="bold 24px sans-serif";g.textAlign="center";g.fillText("M.r Racer",W/2,H/2-40);g.fillStyle="#666";g.font="12px sans-serif";g.fillText("Race through Lagos, hit 5 checkpoints",W/2,H/2);g.fillStyle="#2b4bd8";g.font="bold 14px sans-serif";g.fillText("W/Up=Gas S/Down=Brake A/D=Dodge",W/2,H/2+40);document.querySelectorAll(".btn").forEach(b=>b.classList.add("active"));requestAnimationFrame(draw);return}if(state==="play")update();var camY=car.y-H+200;g.fillStyle="#2b4bd8";g.fillRect(0,0,W,H);g.fillStyle="#5b9bd4";g.fillRect(roadX,0,roadW,H);for(var i=0;i<bldgs.length;i++){var b=bldgs[i];g.fillStyle=b.c;g.fillRect(b.x,b.y-camY,b.w,b.h)}for(var i=0;i<tCars.length;i++){var t=tCars[i];var sy=t.y-camY;if(sy<-50||sy>H+50)continue;g.fillStyle=t.c;g.fillRect(t.x-10,sy,t.w+20,t.h)}var csy=car.y-camY;g.fillStyle="#2b4bd8";g.fillRect(car.x-12,csy-20,36,52);for(var i=cpIdx;i<cps.length;i++){var py=cps[i].y-camY;if(py<-30||py>H+30)continue;g.fillStyle="#ffd700";g.fillRect(roadX-15,py-10,roadW+30,20);g.fillStyle="#fff";g.font="bold 11px sans-serif";g.textAlign="center";g.fillText(cps[i].l,roadX+roadW/2,py+4)}g.fillStyle="rgba(0,0,0,0.5)";g.fillRect(10,10,180,35);g.fillStyle="#fff";g.font="12px sans-serif";g.textAlign="left";g.fillText("Checkpoint "+cpIdx+"/5",20,30);g.fillText("Time: "+Math.ceil(tLeft/60)+"s",20,50);if(state==="done"){g.fillStyle="rgba(0,0,0,0.5)";g.fillRect(0,0,W,H);g.fillStyle="#2b4bd8";g.font="bold 28px sans-serif";g.textAlign="center";g.fillText("RACE COMPLETE!",W/2,H/2-30);g.fillStyle="#fff";g.font="20px sans-serif";g.fillText("Score: "+score,W/2,H/2+20);g.fillText("Best: "+bestTime<999?bestTime+"s":"--",W/2,H/2+50);g.fillText("Click or Enter to race again",W/2,H/2+90)}if(state==="over"){g.fillStyle="rgba(0,0,0,0.5)";g.fillRect(0,0,W,H);g.fillStyle="#dc2626";g.font="bold 28px sans-serif";g.textAlign="center";g.fillText("TIME'S UP!",W/2,H/2-30);g.fillStyle="#fff";g.font="20px sans-serif";g.fillText("Checkpoints: "+cpIdx+"/5 Score: "+score,W/2,H/2+20);g.fillText("Click or Enter to try again",W/2,H/2+70)}requestAnimationFrame(draw)}draw();</script></body></html>
