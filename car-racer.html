<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.r Racer — Lagos Straight Road</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;overflow:hidden;user-select:none;font-family:"Segoe UI",Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
var c=document.getElementById("g"),g=c.getContext("2d");
var W=window.innerWidth,H=window.innerHeight;
c.width=W;c.height=H;

window.addEventListener("resize",function(){
  W=window.innerWidth;H=window.innerHeight;
  c.width=W;c.height=H;
});

var state="menu",score=0,bestTime=999;
var difficulty="normal";

var roadW=Math.min(300,W*0.35);
var roadX=(W-roadW)/2;
var totalLen=8000;

var diffBtns=[
  {label:"Easy",x:W/2-170,y:H/2+60,w:100,h:40,diff:"easy"},
  {label:"Normal",x:W/2-50,y:H/2+60,w:100,h:40,diff:"normal"},
  {label:"Hard",x:W/2+70,y:H/2+60,w:100,h:40,diff:"hard"}
];

function getDiffSettings(){
  if(difficulty==="easy")return{time:90,maxTraffic:10,trafficSpd:2,penalty:90,spawnRate:0.06,multiplier:0.7,maxSpd:4};
  if(difficulty==="hard")return{time:60,maxTraffic:18,trafficSpd:3.5,penalty:150,spawnRate:0.12,multiplier:1.5,maxSpd:6};
  return{time:75,maxTraffic:14,trafficSpd:2.5,penalty:120,spawnRate:0.08,multiplier:1.0,maxSpd:5};
}

var bldgs=[];
function genBldgs(){
  bldgs=[];
  for(var y=0;y<totalLen;y+=80+Math.random()*60){
    if(Math.random()<0.7){
      var bw=50+Math.random()*90,bh=40+Math.random()*60;
      bldgs.push({x:roadX-60-bw-Math.random()*30,y:y,w:bw,h:bh,
      c:["#d4b896","#c9a87c","#b8946a","#e0c9a6","#cbb08e"][~~(Math.random()*5)]});
    }
    if(Math.random()<0.7){
      var bw2=50+Math.random()*90,bh2=40+Math.random()*60;
      bldgs.push({x:roadX+roadW+30+Math.random()*30,y:y,w:bw2,h:bh2,
      c:["#d4b896","#c9a87c","#b8946a","#e0c9a6","#cbb08e"][~~(Math.random()*5)]});
    }
  }
}

var car={x:roadX+roadW/2-15,y:0,w:30,h:55,spd:0};
var tCars=[];

function spawnT(){
  var ds=getDiffSettings();
  if(tCars.length>=ds.maxTraffic)return;
  var lane=roadX+20+Math.random()*(roadW-60);
  tCars.push({x:lane,y:car.y+H+80+Math.random()*400,w:28,h:50,
  spd:ds.trafficSpd+Math.random()*1,
  c:["#a83232","#2b4bd8","#7a1fa8","#0e9f6e","#e11d48"][~~(Math.random()*5)]});
}

var cps=[],cpIdx=0,tLeft=0,tTotal=75*60;
function genCP(){
  cps=[
    {y:200,l:"START"},
    {y:1700,l:"Checkpoint 1"},
    {y:3200,l:"Checkpoint 2"},
    {y:4700,l:"Checkpoint 3"},
    {y:6200,l:"Checkpoint 4"},
    {y:7800,l:"FINISH"}
  ];
}

function startRace(){
  var ds=getDiffSettings();
  tTotal=ds.time*60;
  genCP();genBldgs();cpIdx=0;
  roadW=Math.min(300,W*0.35);roadX=(W-roadW)/2;
  car.x=roadX+roadW/2-15;car.y=0;car.spd=0;
  tLeft=tTotal;score=0;tCars=[];
  for(var i=0;i<ds.maxTraffic;i++)spawnT();
  state="play";
}

function finishRace(){
  var elapsed=(tTotal-tLeft)/60;
  if(elapsed<bestTime)bestTime=elapsed;
  score=Math.floor((tLeft/60*500+(elapsed<45?1000:elapsed<60?500:0))*getDiffSettings().multiplier);
  state="done";
}

var keys={};
document.addEventListener("keydown",function(e){
  keys[e.key.toLowerCase()]=true;
  if(state==="menu"||state==="done"||state==="over")if(e.key==="Enter"||e.key===" ")startRace();
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(e.key.toLowerCase())>-1)e.preventDefault();
});
document.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
c.addEventListener("click",function(e){
  if(state==="menu"){
    var rect=c.getBoundingClientRect();
    var mx=(e.clientX-rect.left)*(W/rect.width),my=(e.clientY-rect.top)*(H/rect.height);
    for(var i=0;i<diffBtns.length;i++){
      var b=diffBtns[i];
      if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){difficulty=b.diff;return;}
    }
    startRace();
  }else if(state!=="play"){startRace();}
});

function update(){
  var ds=getDiffSettings();
  if(keys["a"]||keys["arrowleft"])car.x-=5;
  if(keys["d"]||keys["arrowright"])car.x+=5;
  car.x=Math.max(roadX+8,Math.min(roadX+roadW-car.w-8,car.x));

  if(keys["w"]||keys["arrowup"])car.spd=Math.min(ds.maxSpd,car.spd+0.12);
  else if(keys["s"]||keys["arrowdown"])car.spd=Math.max(0,car.spd-0.15);
  else car.spd*=0.97;

  car.y+=car.spd;
  tLeft--;
  if(tLeft<=0){state="over";return;}

  for(var i=tCars.length-1;i>=0;i--){
    var t=tCars[i];
    t.y-=t.spd;
    if(t.y<car.y-H-100){tCars.splice(i,1);continue;}
    if(Math.abs(car.x-t.x)<24&&car.y+car.h>t.y&&car.y<t.y+t.h){
      tLeft-=ds.penalty;tCars.splice(i,1);
    }
  }
  if(Math.random()<ds.spawnRate)spawnT();

  if(car.y>=cps[cpIdx].y){cpIdx++;if(cpIdx>=cps.length){finishRace();return;}}
}

function draw(){
  W=window.innerWidth;H=window.innerHeight;
  c.width=W;c.height=H;
  roadW=Math.min(300,W*0.35);roadX=(W-roadW)/2;
  diffBtns=[
    {label:"Easy",x:W/2-170,y:H/2+60,w:100,h:40,diff:"easy"},
    {label:"Normal",x:W/2-50,y:H/2+60,w:100,h:40,diff:"normal"},
    {label:"Hard",x:W/2+70,y:H/2+60,w:100,h:40,diff:"hard"}
  ];

  if(state==="menu"){
    g.fillStyle="#1a1a2e";g.fillRect(0,0,W,H);
    g.textAlign="center";g.fillStyle="#f0a500";g.font="bold "+Math.min(52,W*0.06)+"px 'Segoe UI'";
    g.fillText("M.R RACER",W/2,H/2-80);
    g.fillStyle="#fff";g.font=Math.min(22,W*0.028)+"px 'Segoe UI'";g.fillText("LAGOS STRAIGHT ROAD",W/2,H/2-40);
    g.font=Math.min(15,W*0.02)+"px 'Segoe UI'";g.fillStyle="#aab";
    g.fillText("Race through Lagos, hit 5 checkpoints",W/2,H/2+5);
    g.fillText("W or Up = drive forward",W/2,H/2+25);
    g.fillText("S or Down = brake",W/2,H/2+45);
    g.fillText("A/D or Left/Right = dodge traffic",W/2,H/2+65);
    g.fillStyle="#fff";g.font="bold 14px 'Segoe UI'";g.fillText("SELECT DIFFICULTY:",W/2,H/2+100);
    for(var i=0;i<diffBtns.length;i++){
      var b=diffBtns[i];
      g.fillStyle=difficulty===b.diff?"#f0a500":"#334";
      g.fillRect(b.x,b.y,b.w,b.h);
      g.fillStyle=difficulty===b.diff?"#1a1a2e":"#fff";g.font="bold 16px 'Segoe UI'";g.fillText(b.label,b.x+b.w/2,b.y+26);
    }
    g.fillStyle="#ffe98a";g.font="15px 'Segoe UI'";g.fillText("Pick difficulty then click to start",W/2,H/2+150);
    requestAnimationFrame(draw);return;
  }

  if(state==="play")update();

  var camY=car.y-H+180;

  g.fillStyle="#2d5a27";g.fillRect(0,0,W,H);

  for(var i=0;i<bldgs.length;i++){
    var b=bldgs[i],sy=b.y-camY;
    if(sy+b.h<-50||sy>H+50)continue;
    g.fillStyle=b.c;g.fillRect(b.x,sy,b.w,b.h);
    g.fillStyle="rgba(255,255,255,0.3)";
    for(var wx=b.x+6;wx<b.x+b.w-6;wx+=14)for(var wy=sy+6;wy<sy+b.h-6;wy+=14)g.fillRect(wx,wy,6,6);
  }

  g.fillStyle="#4a4a5a";g.fillRect(roadX,0,roadW,H);
  g.fillStyle="#555";g.fillRect(roadX-4,0,4,H);g.fillRect(roadX+roadW,0,4,H);

  g.strokeStyle="#fff";g.lineWidth=2;g.setLineDash([20,16]);
  g.beginPath();g.moveTo(roadX+roadW/2,0);g.lineTo(roadX+roadW/2,H);g.stroke();
  g.setLineDash([]);

  g.fillStyle="#ffcc00";g.fillRect(roadX,0,3,H);g.fillRect(roadX+roadW-3,0,3,H);

  for(var i=0;i<tCars.length;i++){
    var t=tCars[i],sy=t.y-camY;
    if(sy<-60||sy>H+60)continue;
    g.fillStyle=t.c;
    g.beginPath();
    g.moveTo(t.x+4,sy);g.lineTo(t.x+t.w-4,sy);g.lineTo(t.x+t.w,sy+12);
    g.lineTo(t.x+t.w,sy+t.h-10);g.lineTo(t.x+t.w-3,sy+t.h);g.lineTo(t.x+3,sy+t.h);
    g.lineTo(t.x,sy+t.h-10);g.lineTo(t.x,sy+12);g.closePath();g.fill();
    g.fillStyle="#ffe89c";g.fillRect(t.x+3,sy+2,6,4);g.fillRect(t.x+t.w-9,sy+2,6,4);
    g.fillStyle="#111";g.fillRect(t.x-2,sy+8,4,10);g.fillRect(t.x+t.w-2,sy+8,4,10);
    g.fillRect(t.x-2,sy+t.h-18,4,10);g.fillRect(t.x+t.w-2,sy+t.h-18,4,10);
  }

  for(var i=cpIdx;i<cps.length;i++){
    var py=cps[i].y-camY;
    if(py<-30||py>H+30)continue;
    var isNext=i===cpIdx;
    g.strokeStyle=isNext?"#f0a500":"rgba(255,255,255,0.5)";g.lineWidth=isNext?3:2;
    g.beginPath();g.moveTo(roadX-15,py);g.lineTo(roadX+roadW+15,py);g.stroke();
    if(isNext){g.fillStyle="rgba(240,165,0,0.15)";g.fillRect(roadX-15,py-12,roadW+30,24);}
    g.fillStyle=isNext?"#f0a500":"#fff";g.font="bold 13px 'Segoe UI'";g.textAlign="center";
    g.fillText(cps[i].l,roadX+roadW/2,py-18);
  }

  var csy=car.y-camY;
  g.fillStyle="#0e9f6e";
  g.beginPath();
  g.moveTo(car.x+4,csy);g.lineTo(car.x+car.w-4,csy);
  g.lineTo(car.x+car.w,csy+14);
  g.lineTo(car.x+car.w,csy+car.h-12);g.lineTo(car.x+car.w-3,csy+car.h);
  g.lineTo(car.x+3,csy+car.h);
  g.lineTo(car.x,csy+car.h-12);g.lineTo(car.x,csy+14);g.closePath();g.fill();
  g.fillStyle="#0a6b4c";g.fillRect(car.x+5,csy+18,car.w-10,14);
  g.fillStyle="#ffe89c";g.fillRect(car.x+3,csy+2,7,4);g.fillRect(car.x+car.w-10,csy+2,7,4);
  g.fillStyle="#ff4444";g.fillRect(car.x+3,csy+car.h-5,7,4);g.fillRect(car.x+car.w-10,csy+car.h-5,7,4);
  g.fillStyle="#111";g.fillRect(car.x-2,csy+8,5,10);g.fillRect(car.x+car.w-3,csy+8,5,10);
  g.fillRect(car.x-2,csy+car.h-18,5,10);g.fillRect(car.x+car.w-3,csy+car.h-18,5,10);

  g.fillStyle="rgba(0,0,0,0.6)";g.fillRect(10,10,280,85);
  g.fillStyle="#fff";g.font="13px 'Segoe UI'";g.textAlign="left";
  g.fillText("Checkpoint "+(cpIdx)+"/5  ["+difficulty.toUpperCase()+"]",20,30);
  g.fillText("Next: "+cps[cpIdx].l,20,48);
  var sec=Math.ceil(tLeft/60);g.fillStyle=sec<15?"#ff4444":"#fff";
  g.fillText("Time: "+sec+"s",20,68);
  g.fillStyle="#0e9f6e";g.fillRect(20,76,Math.max(0,(tLeft/tTotal)*240),4);

  g.fillStyle="rgba(0,0,0,0.6)";g.fillRect(W-150,10,140,50);
  g.fillStyle="#f0a500";g.font="bold 18px 'Segoe UI'";g.textAlign="right";
  g.fillText("Score: "+score,W-20,32);
  g.fillStyle="#fff";g.font="12px 'Segoe UI'";
  g.fillText("Best: "+(bestTime<999?bestTime.toFixed(1)+"s":"---"),W-20,52);

  var pct=Math.min(100,Math.floor(car.y/totalLen*100));
  g.fillStyle="rgba(0,0,0,0.6)";g.fillRect(W/2-80,H-30,160,20);
  g.fillStyle="#f0a500";g.fillRect(W/2-78,H-28,Math.min(156,pct*1.56),16);
  g.fillStyle="#fff";g.font="bold 12px 'Segoe UI'";g.textAlign="center";g.fillText(pct+"%",W/2,H-16);

  if(state==="done"){
    g.fillStyle="rgba(20,32,92,0.85)";g.fillRect(0,0,W,H);
    g.textAlign="center";g.fillStyle="#f0a500";g.font="bold 48px 'Segoe UI'";
    g.fillText("RACE COMPLETE! ["+difficulty.toUpperCase()+"]",W/2,H/2-50);
    g.fillStyle="#fff";g.font="22px 'Segoe UI'";
    g.fillText("Score: "+score,W/2,H/2);
    g.fillText("Time: "+((tTotal-tLeft)/60).toFixed(1)+"s",W/2,H/2+30);
    if(bestTime<999){g.fillStyle="#0e9f6e";g.fillText("Best: "+bestTime.toFixed(1)+"s",W/2,H/2+60);}
    g.fillStyle="#ffe98a";g.font="bold 18px 'Segoe UI'";
    g.fillText("Click or Enter to race again",W/2,H/2+100);
  }
  if(state==="over"){
    g.fillStyle="rgba(20,10,10,0.85)";g.fillRect(0,0,W,H);
    g.textAlign="center";g.fillStyle="#ff4444";g.font="bold 48px 'Segoe UI'";
    g.fillText("TIME'S UP! ["+difficulty.toUpperCase()+"]",W/2,H/2-40);
    g.fillStyle="#fff";g.font="22px 'Segoe UI'";
    g.fillText("Checkpoints: "+cpIdx+"/5   Score: "+score,W/2,H/2+10);
    g.fillStyle="#ffe98a";g.font="bold 18px 'Segoe UI'";
    g.fillText("Click or Enter to try again",W/2,H/2+60);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
