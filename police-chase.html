<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Police Chick</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f4f8;overflow:hidden;user-select:none;font-family:'Segoe UI',system-ui,Arial}
canvas{display:block;width:100vw;height:100vh}
h1{margin:20px auto;text-align:center;color:#2b4bd8;font-size:24px}
.game-wrapper{max-width:420px;margin:auto;padding:20px}
.score-board{background:white;padding:12px;border-radius:8px;margin:12px 0;text-align:center;color:#2b4bd8; font-size:13px}
.difficulty-btns{display:flex;gap:6px;justify-content:center;flex-wrap:margin:12px 0 .8em}
.diff-btn{padding:6px 10px;border:none;border-radius:16px;background:#2b4bd8;color:white;font-size:12px;cursor:pointer}
.diff-btn:hover{background:#1e3a8a}
.control-hint{text-align:center;padding:8px;color:#666;font-size:11px; margin-top:4px}
.info{text-align:center;padding:8px;color:#666;font-size:11px}
</style>
</head>
<body>
<div class="game-wrapper">
<h1>Police Chase</h1>
<div class="score-board">Score: <span id="sc">0</span>  Lives: <span id="lv">3</span></div>
<canvas id="g"></canvas>
<div class="difficulty-btns">
  <button class="diff-btn easy active" data-diff="easy">Easy</button>
  <button class="diff-btn normal" data-diff="normal">Normal</button>
  <button class="diff-btn hard" data-diff="hard">Hard</button>
</div>
<div class="control-hint">A/D or Left/Right = Move • W or Up = Accel • S or Down = Brake</div>
<div class="info">Dodge cops and bullets — survive as long as you can!</div>
</div>
<script>
var c=document.getElementById("g"),g=c.getContext("2d"),W=window.innerWidth,H=window.innerHeight;
c.width=W;c.height=H;
window.addEventListener("resize",function(){W=window.innerWidth;H=window.innerHeight;c.width=W;c.height=H;});

var state="menu",score=0,lives=3,difficulty="normal";
var roadW=Math.min(320,W*0.45),roadL=(W-roadW)/2,roadR=roadL+roadW;
var totalLen=6000;

var diffSettings={
  easy:{maxCops:3,copSpd:1.5,shootChance:0.01,shootAfter:150,scoreMult:0.8,spawnCap:4},
  hard:{maxCops:6,copSpd:2.5,shootChance:0.04,shootAfter:70,scoreMult:1.5,spawnCap:8},
  normal:{maxCops:4,copSpd:2.0,shootChance:0.02,shootAfter:120,scoreMult:1.0,spawnCap:6}
};

function getDiff(){return diffSettings[difficulty]||diffSettings.normal;}

var car={x:W/2-16,y:H-80,w:32,h:56,spd:0};
var cops=[],bullets=[],particles=[];

function reset(){
  var ds=getDiff();score=0;lives=ds.maxCops;difficulty=document.querySelector('.diff-btn.active').getAttribute("data-diff");
  car.x=W/2-16;car.y=H-80;car.spd=0;cops=[];bullets=[];particles=[];state="play";
}

function spawnCop(){
  var ds=getDiff();var lane=roadL+20+Math.random()*(roadW-40);
  cops.push({x:lane,y:-60-w Math.random()*200,w:28,h:48,spd:ds.copSpd+Math.random()*0.5,c:["#ff6b6b","#5f27cd","#1dd1af"][Math.floor(Math.random()*3)]});
}

var diffBtns=document.querySelectorAll(".diff-btn");
diffBtns.forEach(b=>b.addEventListener("click",function(){
  diffBtns.forEach(x=>x.classList.remove("active"));
  this.classList.add("active");
  reset();
}));

document.addEventListener("keydown",function(e){
  if(state==="menu"){if(e.key==="Enter"||e.key===" "){reset();}return;}
  if(state==="done"||state==="over"){if(e.key==="Enter"||e.key===" "){reset();}return;}
  e.preventDefault();
});
document.addEventListener("keyup",function(e){});

function update(){
  var ds=getDiff();
  if(keys["a"]||keys["arrowleft"]){car.x-=5;car.x=Math.max(roadL+4,Math.min(roadR-car.w-4,car.x));}
  if(keys["d"]||keys["arrowright"]){car.x+=5;car.x=Math.max(roadL+4,Math.min(roadR-car.w-4,car.x));}
  if(keys["w"]||keys["arrowup"]){car.spd=Math.min(6,car.spd+0.15);}
  else if(keys["s"]||keys["arrowdown"]){car.spd=Math.max(0,car.spd-0.2);}
  else car.spd*=0.97;car.y-=car.spd;

  for(var i=cops.length-1;i>=0;i--){
    var c=cops[i];c.y+=c.spd;if(c.y>H+60){cops.splice(i,1);spawnCop();continue;}
    if(Math.abs(car.x-c.x)<20&&car.y+car.h>c.y-10&&car.y<c.y+10){lives--;state="over";}
    c.shoot++;if(c.shoot>ds.shootAfter&&Math.random()<ds.shootChance){
      c.shoot=0;bullets.push({x:c.x+c.w/2,y:c.y+c.h,vy:4,vx:(car.x+16-c.x-c.w/2)*0.03});
    }
  }
  if(cops.length<ds.spawnCap)spawnCop();

  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];b.y+=b.vy;b.x+=b.vx;
    if(b.y>H+20||b.x<-20||b.x>W+20){bullets.splice(i,1);continue;}
    if(Math.abs(b.x-(car.x+16))<16&&Math.abs(b.y-(car.y+28))<28){lives--;state="over";}
    bullets.splice(i,1);
  }

  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];p.x+=Math.random()*2-1;p.y+=Math.random()*2-1;p.life--;if(p.life<=0)particles.splice(i,1);
  }
}

function draw(){
  W=window.innerWidth;H=window.innerHeight;c.width=W;c.height=H;roadW=Math.min(320,W*0.45);roadL=(W-roadW)/2;roadR=roadL+roadW;

  if(state==="menu"){
    g.fillStyle="#f0f4f8";g.fillRect(0,0,W,H);
    g.fillStyle="#2b4bd8";g.font="bold 24px 'Segoe UI'";g.textAlign="center";
    g.fillText("Police Chase",W/2,H/2-40);
    g.fillStyle="#666";g.font="12px 'Segoe UI'";g.fillText("Dodge cops and bullets • A/D to move, W/S to speed",W/2,H/2);
    document.querySelectorAll(".diff-btn").forEach(b=>b.classList.add("active"));
    requestAnimationFrame(draw);return;
  }

  if(state==="play")update();

  g.fillStyle="#2c3550";g.fillRect(0,0,W,H);
  g.fillStyle="#3a3f4a";g.fillRect(roadL,0,roadW,H);
  g.fillStyle="#6a6a7a";g.fillRect(roadL-8,0,8,H);g.fillRect(roadR,0,8,H);
  g.strokeStyle="#fff";g.lineWidth=2;g.setLineDash([12,6]);g.beginPath();g.moveTo(roadL+roadW/2,0);g.lineTo(roadL+roadW/2,H);g.stroke();g.setLineDash([]);

  for(var i=0;i<cops.length;i++){
    var c=cops[i];var sy=c.y;g.fillStyle=c.c;g.fillRect(c.x-14,sy-28,32,56);
    g.fillStyle="#ffd700";g.fillRect(c.x-10,sy-22,20,8);
  }

  for(var i=0;i<bullets.length;i++){
    var b=bullets[i];g.fillStyle="#ff6b6b";g.beginPath();g.arc(b.x,sy||b.y,4,0,Math.PI*2);g.fill();
  }

  g.fillStyle="#ffd700";g.fillRect(car.x-16,H-80,32,56);

  g.fillStyle="rgba(0,0,0,0.6)";g.fillRect(10,10,150,40);
  g.fillStyle="#fff";g.font="12px 'Segoe UI'";g.textAlign="left";
  g.fillText("Score: "+score,20,30);
  g.fillText("Lives: "+"❤".repeat(lives),20,50);

  if(state==="done"||state==="over"){
    g.fillStyle="rgba(0,0,0,0.5)";g.fillRect(0,0,W,H);
    var col=state==="over"?"#dc2626":"#2b4bd8";g.fillStyle=col;g.font="bold 28px 'Segoe UI'";g.textAlign="center";
    g.fillText(state==="over"?"BUSTED!":"RACE COMPLETE!",W/2,H/2-30);
    g.fillStyle="#fff";g.font="18px 'Segoe UI'";g.fillText("Final Score: "+score,W/2,H/2+10);
    g.fillText("Click or Enter to restart",W/2,H/2+50);
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
